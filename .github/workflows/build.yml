
name: Build AutoLike 2.9 APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Gerar projeto Android
        run: |
          mkdir -p proj/app/src/main/java/com/example/autolike
          mkdir -p proj/app/src/main/res/xml
          mkdir -p proj/app/src/main/res/values

          cd proj

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "AutoLike"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2g
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.example.autolike"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.example.autolike"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 29
                  versionName = "2.9"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:label="AutoLike 2.9"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>

                  <service
                      android:name=".AutoLikeService"
                      android:label="AutoLike"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService"/>
                      </intent-filter>

                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_config"/>

                  </service>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/xml/accessibility_config.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service
              xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeViewScrolled|typeWindowStateChanged|typeWindowContentChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagReportViewIds|flagRetrieveInteractiveWindows"
              android:canPerformGestures="true"
              android:canRetrieveWindowContent="true"
              android:description="@string/desc"
              android:notificationTimeout="150"/>
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">AutoLike 2.9</string>
              <string name="desc">Assistente de identificação de corações vazios com confirmação manual.</string>
          </resources>
          EOF

          cat > app/src/main/java/com/example/autolike/MainActivity.kt <<'EOF'
          package com.example.autolike

          import android.app.Activity
          import android.content.Intent
          import android.os.Bundle
          import android.provider.Settings
          import android.graphics.Color
          import android.view.Gravity
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView

          class MainActivity : Activity() {

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val layout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER
                      setPadding(35, 50, 35, 50)
                  }

                  layout.addView(TextView(this).apply {
                      text = "AutoLike 2.9"
                      textSize = 30f
                      setTextColor(Color.BLACK)
                  })

                  layout.addView(TextView(this).apply {
                      text = """
                          Assistente de curtidas

                          1. Ative o serviço de acessibilidade.
                          2. Abra os comentários no TikTok.
                          3. Ajuste a caixa sobre os corações.
                          4. Inicie o reconhecimento.
                          5. Confirme manualmente cada curtida.
                          6. Role a tela para procurar novos comentários.

                          Corações vermelhos são ignorados.
                      """.trimIndent()
                      textSize = 17f
                      setPadding(0, 25, 0, 25)
                  })

                  layout.addView(Button(this).apply {
                      text = "ATIVAR ACESSIBILIDADE"
                      setOnClickListener {
                          startActivity(
                              Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)
                          )
                      }
                  })

                  setContentView(layout)
              }
          }
          EOF

          cat > app/src/main/java/com/example/autolike/AutoLikeService.kt <<'EOF'
          package com.example.autolike

          import android.accessibilityservice.AccessibilityService
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.graphics.Rect
          import android.graphics.drawable.GradientDrawable
          import android.os.Handler
          import android.os.Looper
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.View
          import android.view.WindowManager
          import android.view.accessibility.AccessibilityEvent
          import android.view.accessibility.AccessibilityNodeInfo
          import android.widget.Button
          import android.widget.TextView
          import kotlin.math.abs

          class AutoLikeService : AccessibilityService() {

              private lateinit var wm: WindowManager
              private val handler = Handler(Looper.getMainLooper())

              private var running = false
              private var waitingForScroll = false
              private var speed = 1

              private var zone: TextView? = null
              private var status: TextView? = null
              private var startButton: Button? = null
              private var confirmButton: Button? = null
              private var speedButton: Button? = null

              private var candidateRect: Rect? = null
              private var candidateLabel = ""

              private val views = mutableListOf<View>()

              private val tiktokPackages = setOf(
                  "com.ss.android.ugc.aweme",
                  "com.ss.android.ugc.aweme.lite",
                  "com.zhiliaoapp.musically",
                  "com.ss.android.ugc.trill"
              )

              private data class HeartCandidate(
                  val bounds: Rect,
                  val label: String
              )

              override fun onServiceConnected() {
                  super.onServiceConnected()

                  wm = getSystemService(WINDOW_SERVICE) as WindowManager

                  val width = resources.displayMetrics.widthPixels
                  val height = resources.displayMetrics.heightPixels

                  startButton = addButton(
                      "INICIAR",
                      0,
                      width / 20,
                      150
                  ) {
                      if (running) stopService()
                      else startService()
                  }

                  speedButton = addButton(
                      "VEL: NORMAL",
                      0,
                      width / 3,
                      150
                  ) {
                      speed = (speed + 1) % 3

                      speedButton?.text = when (speed) {
                          0 -> "VEL: LENTA"
                          1 -> "VEL: NORMAL"
                          else -> "VEL: RÁPIDA"
                      }
                  }

                  zone = addZone(
                      width * 70 / 100,
                      height * 32 / 100,
                      width * 22 / 100,
                      height * 50 / 100
                  )

                  status = addLabel(
                      "AGUARDANDO",
                      width / 20,
                      260
                  )

                  confirmButton = addButton(
                      "CONFIRMAR CURTIDA",
                      0,
                      width / 20,
                      340
                  ) {
                      confirmCandidate()
                  }

                  confirmButton?.visibility = View.GONE
              }

              private fun addButton(
                  label: String,
                  ignored: Int,
                  x: Int,
                  y: Int,
                  action: () -> Unit
              ): Button {

                  val button = Button(this).apply {
                      text = label
                      textSize = 11f
                      setTextColor(Color.WHITE)
                      setBackgroundColor(Color.rgb(35, 100, 180))
                      setOnClickListener { action() }
                  }

                  val params = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                      PixelFormat.TRANSLUCENT
                  )

                  params.gravity = Gravity.TOP or Gravity.START
                  params.x = x
                  params.y = y

                  wm.addView(button, params)
                  views.add(button)

                  return button
              }

              private fun addLabel(
                  label: String,
                  x: Int,
                  y: Int
              ): TextView {

                  val view = TextView(this).apply {
                      text = label
                      textSize = 13f
                      setTextColor(Color.WHITE)
                      setPadding(12, 8, 12, 8)
                      setBackgroundColor(Color.DKGRAY)
                  }

                  val params = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                      PixelFormat.TRANSLUCENT
                  )

                  params.gravity = Gravity.TOP or Gravity.START
                  params.x = x
                  params.y = y

                  wm.addView(view, params)
                  views.add(view)

                  return view
              }

              private fun addZone(
                  x: Int,
                  y: Int,
                  width: Int,
                  height: Int
              ): TextView {

                  val view = TextView(this).apply {
                      text = "ÁREA DOS CORAÇÕES"
                      gravity = Gravity.CENTER
                      textSize = 12f
                      setTextColor(Color.WHITE)

                      background = GradientDrawable().apply {
                          setColor(0x22FF0000)
                          setStroke(4, Color.RED)
                          cornerRadius = 12f
                      }
                  }

                  val params = WindowManager.LayoutParams(
                      width,
                      height,
                      WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                      PixelFormat.TRANSLUCENT
                  )

                  params.gravity = Gravity.TOP or Gravity.START
                  params.x = x
                  params.y = y

                  var downX = 0f
                  var downY = 0f
                  var initialX = 0
                  var initialY = 0

                  view.setOnTouchListener { v, event ->
                      when (event.action) {
                          MotionEvent.ACTION_DOWN -> {
                              downX = event.rawX
                              downY = event.rawY
                              initialX = params.x
                              initialY = params.y
                          }

                          MotionEvent.ACTION_MOVE -> {
                              params.x = initialX +
                                  (event.rawX - downX).toInt()

                              params.y = initialY +
                                  (event.rawY - downY).toInt()

                              wm.updateViewLayout(v, params)
                          }
                      }
                      true
                  }

                  wm.addView(view, params)
                  views.add(view)

                  return view
              }

              private fun startService() {
                  running = true
                  waitingForScroll = false
                  candidateRect = null

                  startButton?.text = "PARAR"
                  status?.text = "PROCURANDO CORAÇÕES"

                  scan()
              }

              private fun stopService() {
                  running = false
                  waitingForScroll = false
                  candidateRect = null

                  startButton?.text = "INICIAR"
                  status?.text = "PARADO"

                  confirmButton?.visibility = View.GONE
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {
                  if (!running || event == null) return

                  when (event.eventType) {

                      AccessibilityEvent.TYPE_VIEW_SCROLLED -> {
                          if (waitingForScroll) {
                              waitingForScroll = false
                              candidateRect = null

                              status?.text = "TELA ROLADA - PROCURANDO"

                              handler.postDelayed({
                                  if (running) scan()
                              }, 700)
                          }
                      }

                      AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED,
                      AccessibilityEvent.TYPE_WINDOW_CONTENT_CHANGED -> {
                          if (!waitingForScroll &&
                              candidateRect == null
                          ) {
                              handler.postDelayed({
                                  if (running && !waitingForScroll) {
                                      scan()
                                  }
                              }, 350)
                          }
                      }
                  }
              }

              private fun scan() {
                  if (!running || waitingForScroll) return

                  val root = rootInActiveWindow ?: return

                  if (root.packageName?.toString() !in tiktokPackages) {
                      status?.text = "ABRA OS COMENTÁRIOS DO TIKTOK"
                      return
                  }

                  val candidate = findHeart(root)

                  if (candidate != null) {
                      candidateRect = candidate.bounds
                      candidateLabel = candidate.label

                      status?.text = "CORAÇÃO VAZIO ENCONTRADO"

                      confirmButton?.visibility = View.VISIBLE
                  } else {
                      status?.text = "NENHUM CORAÇÃO IDENTIFICADO"
                      confirmButton?.visibility = View.GONE
                  }
              }

              private fun isEmptyHeart(
                  node: AccessibilityNodeInfo
              ): Boolean {

                  val description =
                      node.contentDescription?.toString()
                          ?.lowercase() ?: ""

                  val text =
                      node.text?.toString()
                          ?.lowercase() ?: ""

                  val label = "$description $text".trim()

                  if (label.isEmpty()) return false

                  val forbidden = listOf(
                      "curtido",
                      "descurtir",
                      "liked",
                      "unlike",
                      "remover curtida"
                  )

                  if (forbidden.any { label.contains(it) }) {
                      return false
                  }

                  return label == "curtir" ||
                      label.startsWith("curtir ") ||
                      label == "like" ||
                      label.startsWith("like ")
              }

              private fun isInsideZone(
                  node: AccessibilityNodeInfo
              ): Boolean {

                  val bounds = Rect()
                  node.getBoundsInScreen(bounds)

                  val area = zone ?: return false

                  val location = IntArray(2)
                  area.getLocationOnScreen(location)

                  val zoneRect = Rect(
                      location[0],
                      location[1],
                      location[0] + area.width,
                      location[1] + area.height
                  )

                  return zoneRect.contains(
                      bounds.centerX(),
                      bounds.centerY()
                  )
              }

              private fun findHeart(
                  node: AccessibilityNodeInfo
              ): HeartCandidate? {

                  val bounds = Rect()
                  node.getBoundsInScreen(bounds)

                  val validSize =
                      bounds.width() in 6..140 &&
                      bounds.height() in 6..140

                  if (
                      validSize &&
                      isInsideZone(node) &&
                      isEmptyHeart(node) &&
                      (node.isClickable ||
                          node.parent?.isClickable == true)
                  ) {
                      val label =
                          node.contentDescription?.toString()
                              ?: node.text?.toString()
                              ?: ""

                      return HeartCandidate(
                          Rect(bounds),
                          label
                      )
                  }

                  for (i in 0 until node.childCount) {
                      val child = node.getChild(i) ?: continue

                      val result = findHeart(child)

                      if (result != null) return result
                  }

                  return null
              }

              private fun confirmCandidate() {
                  if (!running || waitingForScroll) return

                  val expected = candidateRect ?: return
                  val root = rootInActiveWindow ?: return

                  if (root.packageName?.toString() !in tiktokPackages) {
                      status?.text = "TIKTOK NÃO ESTÁ ATIVO"
                      return
                  }

                  val current = findMatchingNode(root, expected)

                  if (current == null) {
                      candidateRect = null
                      confirmButton?.visibility = View.GONE
                      status?.text = "COMENTÁRIO MUDOU - RECONHECENDO NOVAMENTE"
                      return
                  }

                  var target: AccessibilityNodeInfo? = current

                  while (target != null && !target.isClickable) {
                      target = target.parent
                  }

                  if (target != null &&
                      target.performAction(
                          AccessibilityNodeInfo.ACTION_CLICK
                      )
                  ) {
                      waitingForScroll = true
                      candidateRect = null

                      confirmButton?.visibility = View.GONE
                      status?.text = "CURTIDA CONFIRMADA - AGUARDANDO ROLAGEM"
                  } else {
                      status?.text = "NÃO FOI POSSÍVEL CONFIRMAR"
                  }
              }

              private fun findMatchingNode(
                  node: AccessibilityNodeInfo,
                  expected: Rect
              ): AccessibilityNodeInfo? {

                  val bounds = Rect()
                  node.getBoundsInScreen(bounds)

                  val samePosition =
                      abs(bounds.centerX() - expected.centerX()) < 12 &&
                      abs(bounds.centerY() - expected.centerY()) < 12

                  if (
                      samePosition &&
                      isEmptyHeart(node) &&
                      isInsideZone(node)
                  ) {
                      return node
                  }

                  for (i in 0 until node.childCount) {
                      val child = node.getChild(i) ?: continue

                      val result = findMatchingNode(child, expected)

                      if (result != null) return result
                  }

                  return null
              }

              override fun onInterrupt() {
                  stopService()
              }

              override fun onDestroy() {
                  stopService()
                  handler.removeCallbacksAndMessages(null)

                  for (view in views) {
                      try {
                          wm.removeView(view)
                      } catch (_: Exception) {
                      }
                  }

                  views.clear()
                  super.onDestroy()
              }
          }
          EOF

      - name: Compilar APK
        working-directory: proj
        run: gradle assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoLike-2.9-APK
          path: proj/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
