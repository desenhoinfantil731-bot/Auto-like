name: Build AutoLike 3.1 APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Gerar projeto
        run: |
          mkdir -p proj/app/src/main/java/com/example/autolike proj/app/src/main/res/xml proj/app/src/main/res/values
          cd proj

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "AutoLike"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2g
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.example.autolike"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.example.autolike"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 31
                  versionName = "3.1"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:label="AutoLike 3.1" android:theme="@android:style/Theme.DeviceDefault.Light">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".AutoLikeService"
                      android:exported="true"
                      android:label="AutoLike 3.1"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_config" />
                  </service>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/xml/accessibility_config.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeViewScrolled|typeWindowStateChanged|typeWindowContentChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagReportViewIds|flagRetrieveInteractiveWindows"
              android:canPerformGestures="true"
              android:canRetrieveWindowContent="true"
              android:description="@string/desc"
              android:notificationTimeout="150" />
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="desc">AutoLike 3.1 com caixa vermelha ajustável e confirmação manual.</string>
          </resources>
          EOF

          cat > app/src/main/java/com/example/autolike/MainActivity.kt <<'EOF'
          package com.example.autolike

          import android.app.Activity
          import android.content.Intent
          import android.os.Bundle
          import android.provider.Settings
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView

          class MainActivity : Activity() {
              override fun onCreate(s: Bundle?) {
                  super.onCreate(s)
                  val l = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(48, 96, 48, 48)
                  }
                  l.addView(TextView(this).apply {
                      text = "AutoLike 3.1\n\n1) Ative o serviço nas Configurações de Acessibilidade.\n2) Abra o TikTok e os comentários.\n3) Posicione a Caixa Vermelha sobre os corações.\n4) Toque em INICIAR e confirme as curtidas quando solicitado!"
                      textSize = 17f
                  })
                  l.addView(Button(this).apply {
                      text = "Abrir acessibilidade"
                      setOnClickListener { startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)) }
                  })
                  setContentView(l)
              }
          }
          EOF

          cat > app/src/main/java/com/example/autolike/AutoLikeService.kt <<'EOF'
          package com.example.autolike

          import android.accessibilityservice.AccessibilityService
          import android.accessibilityservice.GestureDescription
          import android.annotation.SuppressLint
          import android.graphics.Color
          import android.graphics.Path
          import android.graphics.PixelFormat
          import android.graphics.Rect
          import android.graphics.drawable.GradientDrawable
          import android.os.Handler
          import android.os.Looper
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.View
          import android.view.WindowManager
          import android.view.accessibility.AccessibilityEvent
          import android.view.accessibility.AccessibilityNodeInfo
          import android.widget.Button
          import android.widget.TextView
          import kotlin.math.abs

          class AutoLikeService : AccessibilityService() {
              private val h = Handler(Looper.getMainLooper())
              private var running = false
              private var waitingForScroll = false

              private var btn: Button? = null
              private var confirmBtn: Button? = null
              private var statusTv: TextView? = null
              private var zoneBox: TextView? = null

              private var candidateRect: Rect? = null
              private val views = mutableListOf<View>()
              private lateinit var wm: WindowManager

              private val tiktokPackages = setOf(
                  "com.ss.android.ugc.aweme",
                  "com.ss.android.ugc.aweme.lite",
                  "com.zhiliaoapp.musically",
                  "com.ss.android.ugc.trill"
              )

              data class HeartCandidate(val bounds: Rect, val node: AccessibilityNodeInfo)

              override fun onServiceConnected() {
                  wm = getSystemService(WINDOW_SERVICE) as WindowManager
                  val m = resources.displayMetrics
                  val w = m.widthPixels
                  val hh = m.heightPixels

                  btn = addFloatingButton("INICIAR", Color.parseColor("#2E7D32"), w / 20, 150) {
                      if (running) stopService() else startService()
                  }

                  statusTv = addStatusLabel("AGUARDANDO", w / 20, 240)

                  confirmBtn = addFloatingButton("CONFIRMAR CURTIDA", Color.parseColor("#C62828"), w / 20, 310) {
                      confirmCandidate()
                  }
                  confirmBtn?.visibility = View.GONE

                  zoneBox = addZoneBox((w * 0.70f).toInt(), (hh * 0.32f).toInt(), (w * 0.22f).toInt(), (hh * 0.50f).toInt())
              }

              @SuppressLint("ClickableViewAccessibility")
              private fun addFloatingButton(label: String, color: Int, x: Int, y: Int, onClick: () -> Unit): Button {
                  val b = Button(this).apply {
                      text = label
                      textSize = 12f
                      setTextColor(Color.WHITE)
                      setBackgroundColor(color)
                      setOnClickListener { onClick() }
                  }
                  val p = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                      PixelFormat.TRANSLUCENT
                  )
                  p.gravity = Gravity.TOP or Gravity.START
                  p.x = x
                  p.y = y
                  wm.addView(b, p)
                  views.add(b)
                  return b
              }

              private fun addStatusLabel(label: String, x: Int, y: Int): TextView {
                  val tv = TextView(this).apply {
                      text = label
                      textSize = 12f
                      setTextColor(Color.WHITE)
                      setPadding(12, 6, 12, 6)
                      setBackgroundColor(Color.DKGRAY)
                  }
                  val p = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                      PixelFormat.TRANSLUCENT
                  )
                  p.gravity = Gravity.TOP or Gravity.START
                  p.x = x
                  p.y = y
                  wm.addView(tv, p)
                  views.add(tv)
                  return tv
              }

              @SuppressLint("ClickableViewAccessibility")
              private fun addZoneBox(x: Int, y: Int, width: Int, height: Int): TextView {
                  val tv = TextView(this).apply {
                      text = "ÁREA DOS CORAÇÕES\n(Arraste aqui)"
                      gravity = Gravity.CENTER
                      textSize = 11f
                      setTextColor(Color.WHITE)
                      background = GradientDrawable().apply {
                          setColor(0x22FF0000)
                          setStroke(4, Color.RED)
                          cornerRadius = 12f
                      }
                  }
                  val p = WindowManager.LayoutParams(
                      width,
                      height,
                      WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                      PixelFormat.TRANSLUCENT
                  )
                  p.gravity = Gravity.TOP or Gravity.START
                  p.x = x
                  p.y = y

                  var downX = 0f
                  var downY = 0f
                  var startX = 0
                  var startY = 0

                  tv.setOnTouchListener { v, e ->
                      when (e.action) {
                          MotionEvent.ACTION_DOWN -> {
                              downX = e.rawX
                              downY = e.rawY
                              startX = p.x
                              startY = p.y
                          }
                          MotionEvent.ACTION_MOVE -> {
                              p.x = startX + (e.rawX - downX).toInt()
                              p.y = startY + (e.rawY - downY).toInt()
                              wm.updateViewLayout(v, p)
                          }
                      }
                      true
                  }
                  wm.addView(tv, p)
                  views.add(tv)
                  return tv
              }

              private fun startService() {
                  running = true
                  waitingForScroll = false
                  candidateRect = null
                  btn?.text = "PARAR"
                  statusTv?.text = "PROCURANDO CORAÇÕES"
                  scan()
              }

              private fun stopService() {
                  running = false
                  waitingForScroll = false
                  candidateRect = null
                  btn?.text = "INICIAR"
                  statusTv?.text = "PARADO"
                  confirmBtn?.visibility = View.GONE
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {
                  if (!running || event == null) return

                  when (event.eventType) {
                      AccessibilityEvent.TYPE_VIEW_SCROLLED -> {
                          if (waitingForScroll) {
                              waitingForScroll = false
                              candidateRect = null
                              statusTv?.text = "TELA ROLADA - BUSCANDO"
                              h.postDelayed({ if (running) scan() }, 600)
                          }
                      }
                      AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED,
                      AccessibilityEvent.TYPE_WINDOW_CONTENT_CHANGED -> {
                          if (!waitingForScroll && candidateRect == null) {
                              h.postDelayed({
                                  if (running && !waitingForScroll && candidateRect == null) scan()
                              }, 300)
                          }
                      }
                  }
              }

              private fun scan() {
                  if (!running || waitingForScroll || candidateRect != null) return
                  val root = rootInActiveWindow ?: return

                  if (root.packageName?.toString() !in tiktokPackages) {
                      statusTv?.text = "ABRA OS COMENTÁRIOS DO TIKTOK"
                      return
                  }

                  val candidate = findHeart(root)
                  if (candidate != null) {
                      candidateRect = candidate.bounds
                      statusTv?.text = "CORAÇÃO ENCONTRADO! CONFIRME"
                      confirmBtn?.visibility = View.VISIBLE
                  } else {
                      statusTv?.text = "AGUARDANDO CORAÇÃO NA ÁREA"
                      confirmBtn?.visibility = View.GONE
                  }
              }

              private fun isInsideZone(bounds: Rect): Boolean {
                  val area = zoneBox ?: return false
                  val loc = IntArray(2)
                  area.getLocationOnScreen(loc)
                  val zoneRect = Rect(loc[0], loc[1], loc[0] + area.width, loc[1] + area.height)
                  return zoneRect.contains(bounds.centerX(), bounds.centerY())
              }

              private fun findHeart(node: AccessibilityNodeInfo?): HeartCandidate? {
                  if (node == null) return null
                  val bounds = Rect()
                  node.getBoundsInScreen(bounds)

                  val desc = (node.contentDescription?.toString() ?: "").lowercase()
                  val id = (node.viewIdResourceName ?: "").lowercase()
                  val stateDesc = if (android.os.Build.VERSION.SDK_INT >= 30) {
                      node.stateDescription?.toString()?.lowercase() ?: ""
                  } else ""

                  val isAlreadyLiked = desc.contains("descurtir") || 
                          desc.contains("curtido") || 
                          desc.contains("unlike") || 
                          desc.contains("liked") || 
                          desc.contains("remover") ||
                          stateDesc.contains("curtido") ||
                          node.isSelected || 
                          node.isChecked

                  val isHeartCandidate = desc.contains("curtir") || desc.contains("like") ||
                          desc.contains("digg") || id.contains("digg") || id.contains("like") ||
                          id.contains("iv_like") || desc.contains("coração") ||
                          (node.isClickable && bounds.width() in 15..120 && bounds.height() in 15..120)

                  if (isHeartCandidate && !isAlreadyLiked && isInsideZone(bounds) && bounds.width() > 0) {
                      return HeartCandidate(Rect(bounds), node)
                  }

                  for (i in 0 until node.childCount) {
                      val result = findHeart(node.getChild(i))
                      if (result != null) return result
                  }
                  return null
              }

              private fun confirmCandidate() {
                  if (!running) return
                  val expected = candidateRect ?: return
                  val root = rootInActiveWindow ?: return

                  var target = findMatchingNode(root, expected)
                  while (target != null && !target.isClickable) {
                      target = target.parent
                  }

                  if (target != null && target.performAction(AccessibilityNodeInfo.ACTION_CLICK)) {
                      waitingForScroll = true
                      candidateRect = null
                      confirmBtn?.visibility = View.GONE
                      statusTv?.text = "CURTIDO! ROLE A TELA"
                  } else {
                      val p = Path()
                      p.moveTo(expected.exactCenterX(), expected.exactCenterY())
                      val g = GestureDescription.Builder().addStroke(GestureDescription.StrokeDescription(p, 0, 50)).build()
                      dispatchGesture(g, null, null)

                      waitingForScroll = true
                      candidateRect = null
                      confirmBtn?.visibility = View.GONE
                      statusTv?.text = "CURTIDO! ROLE A TELA"
                  }
              }

              private fun findMatchingNode(node: AccessibilityNodeInfo?, expected: Rect): AccessibilityNodeInfo? {
                  if (node == null) return null
                  val bounds = Rect()
                  node.getBoundsInScreen(bounds)

                  if (abs(bounds.centerX() - expected.centerX()) < 25 && abs(bounds.centerY() - expected.centerY()) < 25) {
                      return node
                  }

                  for (i in 0 until node.childCount) {
                      val result = findMatchingNode(node.getChild(i), expected)
                      if (result != null) return result
                  }
                  return null
              }

              override fun onInterrupt() { stopService() }

              override fun onDestroy() {
                  stopService()
                  h.removeCallbacksAndMessages(null)
                  for (v in views) {
                      try { wm.removeView(v) } catch (_: Exception) {}
                  }
                  views.clear()
                  super.onDestroy()
              }
          }
          EOF

      - name: Compilar APK
        working-directory: proj
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: AutoLike-3.1-APK
          path: proj/app/build/outputs/apk/debug/app-debug.apk
